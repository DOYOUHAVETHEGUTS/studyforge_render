<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — StudyForge</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="wrap" style="max-width:400px;margin-top:12vh">
  <div class="brand" style="justify-content:center;margin-bottom:20px">
    <div class="mark">SF</div>
    <div><b>StudyForge</b><small>sign in to continue</small></div>
  </div>
  <div class="panel">
    {% if bad %}<div class="banner warn" style="margin-bottom:14px">Incorrect password.</div>{% endif %}
    <form method="post" action="/login">
      <div class="field-row" style="flex-direction:column;align-items:stretch;gap:6px">
        <label style="width:auto">Access password</label>
        <input type="password" name="password" autofocus required
               style="background:var(--bg-2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px 11px">
      </div>
      <button class="btn primary" type="submit" style="width:100%;justify-content:center;margin-top:12px">Sign in</button>
    </form>
    <div class="sub" style="margin-top:12px;text-align:center">Ask KeAndre for the password.</div>
  </div>
</div>
</body>
</html>
